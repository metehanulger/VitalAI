[project]
name = "vitialai-backend"
version = "2.0.0"
description = "Emergency department pre-triage and routing API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.28,<2.1",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "google-generativeai>=0.5.0",
]

[project.optional-dependencies]
db2 = ["ibm-db>=3.2.0", "ibm_db_sa>=0.4.4"]
llm = ["ibm-watsonx-ai>=1.0.0"]
postgres = ["psycopg2-binary>=2.9.9"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
