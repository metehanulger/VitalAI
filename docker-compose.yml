# Başlatma: docker compose up --build
# Arayüz http://localhost:5173 adresinde açılır.
services:
  postgres:
    image: postgres:17.5-alpine
    container_name: triaj-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triaj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triaj_sifre}
      POSTGRES_DB: ${POSTGRES_DB:-triajdb}
      TZ: Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: triaj-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-triaj}:${POSTGRES_PASSWORD:-triaj_sifre}@postgres:5432/${POSTGRES_DB:-triajdb}
      # Backend açılışta Alembic migration'larını uygular (şema + referans verisi)
      DB_AUTO_MIGRATE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/model_artifacts:/app/model_artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: triaj-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
